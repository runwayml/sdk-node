# Publish when release-please publishes a GitHub release, or by hand.
# No `push: tags` trigger: the release creates the tag, so both would fire and race npm (E409).
# Manual: https://www.github.com/runwayml/sdk-node/actions/workflows/publish-npm.yml
name: Publish NPM
on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          yarn install

      - name: Publish to NPM
        run: |
          bash ./bin/publish-npm
